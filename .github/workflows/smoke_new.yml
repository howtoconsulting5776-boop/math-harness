name: Smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  bundled-tools:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install required dependency
        run: python -m pip install sympy

      - name: Run verification demo
        run: python skills/math-verification/scripts/verify.py --demo

      - name: Run geometry demo
        run: python skills/geometry-figures/scripts/geo_verify.py --demo

      - name: Run SVG demo
        run: python skills/geometry-figures/scripts/svg_figure.py --demo fig_new.svg

      - name: Run problem-bank demo
        run: python skills/problem-bank/scripts/bank.py --demo

